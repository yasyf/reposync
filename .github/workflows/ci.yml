name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs only: cancelling in-progress runs on main leaves landed commits with no
# CI verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Timeouts kill a wedged test in minutes instead of GitHub's 6-hour cap.
jobs:
  test:
    # macOS only: daemonkit is a macOS library as of v0.21.0 and no longer
    # compiles off darwin, so every job that builds this module needs a darwin
    # host.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install jj
        run: |
          version=0.42.0
          tarball=jj-v${version}-aarch64-apple-darwin.tar.gz
          curl -fsSL -o /tmp/jj.tar.gz \
            "https://github.com/jj-vcs/jj/releases/download/v${version}/${tarball}"
          sudo tar -xzf /tmp/jj.tar.gz -C /usr/local/bin ./jj
          jj --version
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  # Static analysis type-checks the tree, so it runs for darwin. GOOS/GOARCH
  # keep it on a cheap linux runner instead of billing macOS minutes 10x.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          GOOS='' GOARCH='' go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
